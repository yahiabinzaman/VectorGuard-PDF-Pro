<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VectorGuard PDF Pro</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="app-wrapper">
    <!-- Main Content Area -->
    <div class="main-content">

      <!-- Document Status Bar -->
      <div class="doc-card" id="docCard">
        <div class="doc-status-indicator" id="statusDot"></div>
        <div class="doc-info">
          <div class="doc-title-row">
            <span class="doc-title" id="docTitle">Checking Document...</span>
            <span class="badge-artboards" id="badgeArtboards" style="display:none;">0 Pages</span>
          </div>
          <span class="doc-meta" id="docMeta">Detecting active file...</span>
        </div>
        <button class="btn-refresh" id="btnRefresh" title="Refresh Document Info">Refresh</button>
      </div>

      <!-- Resolution / Scale Settings -->
      <div class="section-panel">
        <div class="section-label">
          <span>Resolution / Scale</span>
          <span class="sub-hint">2x recommended</span>
        </div>
        <div class="chip-grid">
          <div class="chip" data-scale="100">1x (100%)</div>
          <div class="chip active" data-scale="200">2x (200%)</div>
          <div class="chip" data-scale="300">3x (300%)</div>
          <input type="number" class="custom-scale-input" id="customScaleInput" placeholder="Custom%" min="10" max="800">
        </div>
      </div>

      <!-- Format Settings -->
      <div class="section-panel">
        <div class="section-label">Raster Format</div>
        <div class="format-toggle">
          <button class="format-btn active" id="btnFormatPNG" type="button">
            <span>PNG (24-bit)</span>
          </button>
          <button class="format-btn" id="btnFormatJPG" type="button">
            <span>JPEG (High Quality)</span>
          </button>
        </div>
        
        <div class="sub-options" id="pngOptionsRow">
          <span>Background:</span>
          <div style="display: flex; gap: 10px;">
            <label class="checkbox-label">
              <input type="radio" name="pngBg" value="white" checked> White
            </label>
            <label class="checkbox-label">
              <input type="radio" name="pngBg" value="transparent"> Transparent
            </label>
          </div>
        </div>
      </div>

      <!-- Artboards Selection -->
      <div class="section-panel">
        <div class="section-label">Artboards To Include</div>
        <div style="display: flex; gap: 14px; margin-bottom: 3px;">
          <label class="checkbox-label">
            <input type="radio" name="artboardMode" value="all" checked id="abModeAll">
            <span>All Artboards</span>
          </label>
          <label class="checkbox-label">
            <input type="radio" name="artboardMode" value="range" id="abModeRange">
            <span>Range</span>
          </label>
        </div>
        <div class="input-group" id="rangeInputGroup" style="display: none;">
          <input type="text" class="input-field" id="txtArtboardRange" placeholder="e.g. 1-10, 15, 20-35">
        </div>
      </div>

      <!-- Output Settings -->
      <div class="section-panel">
        <div class="section-label">Output Destination</div>
        <div class="input-group input-with-btn">
          <input type="text" class="input-field" id="txtOutputDir" placeholder="Destination Folder...">
          <button class="btn-secondary" id="btnBrowseDir">Browse</button>
        </div>

        <div class="input-group" style="margin-top: 4px;">
          <input type="text" class="input-field" id="txtPdfName" placeholder="Client_Preview.pdf">
        </div>

        <div style="margin-top: 6px; display: flex; flex-direction: column; gap: 4px;">
          <div style="display: flex; justify-content: space-between; align-items: center;">
            <label class="checkbox-label" title="Automatically opens destination folder when PDF is created">
              <input type="checkbox" id="chkRevealFolder" checked>
              <span>Show in Folder when done</span>
            </label>
            <label class="checkbox-label" title="Fast linked baking without DOM overhead">
              <input type="checkbox" id="chkTurbo" checked>
              <span style="color:#58a6ff; font-weight:500;">Turbo Mode</span>
            </label>
          </div>
          <label class="checkbox-label">
            <input type="checkbox" id="chkAutoClean" checked>
            <span>Delete temporary files</span>
          </label>
        </div>
      </div>

      <!-- Integrated Futuristic Progress Widget (Positioned right above CTA Button) -->
      <div class="cyber-progress-widget" id="progressContainer">
        <div class="cyber-header">
          <div class="cyber-status-group">
            <div class="cyber-pulse-dot"></div>
            <span class="cyber-status-text" id="progressStatusText">PIPELINE RUNNING</span>
          </div>
          <span class="cyber-pct-badge" id="progressPct">0%</span>
        </div>
        <div class="cyber-track">
          <div class="cyber-fill" id="progressFill"></div>
        </div>
        <div class="cyber-subtext" id="progressSubText">> COMPILING PDF STREAM...</div>
      </div>

      <!-- Primary Action Button -->
      <button class="btn-primary" id="btnGenerate">
        <span>Create Client PDF</span>
      </button>

      <!-- Result Banner with Folder & File Reveal Actions -->
      <div class="result-box" id="resultBox">
        <div id="resultMessage">PDF Created Successfully</div>
        <div class="result-actions">
          <button class="action-btn-link highlight" id="btnRevealFolder" type="button">Show in Folder</button>
          <button class="action-btn-link" id="linkOpenResult" type="button">Open File</button>
        </div>
      </div>

    </div>

    <!-- Fixed Footer -->
    <footer class="footer">
      <a class="dev-credit" id="linkGithub" title="Visit Developer's GitHub Profile">
        <svg class="github-icon" viewBox="0 0 16 16" version="1.1" aria-hidden="true">
          <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"></path>
        </svg>
        <span>Developer: <span class="dev-name">Yahia Bin Zaman</span></span>
        <span class="version-tag">v1.0</span>
      </a>
    </footer>

  </div>

  <script src="js/CSInterface.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
